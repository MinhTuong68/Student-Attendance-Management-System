<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị | Điểm danh sinh viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] h-screen flex overflow-hidden">
    <!-- Thanh menu -->
    <div id="sidebar" class="w-64 transition-all duration-300 overflow-hidden bg-[#1e293b] text-slate-300 flex flex-col justify-between p-4 border-r border-slate-800">
        <div>
            <div class="px-2 py-4 mb-6 border-b border-slate-700/50">
                <div class="flex items-center justify-between">
                    
                    <div id="sidebarText" class="transition-all duration-300">
                        <h1 class="text-xl font-bold text-white tracking-wide whitespace-nowrap">Trang quản trị</h1>
                        <p class="text-xs text-slate-400 mt-1 whitespace-nowrap">Hệ thống điểm danh sinh viên</p>
                    </div>

                    <button id="toggleBtn" class="text-white hover:text-gray-400 focus:outline-none -mr-3 py-2 text-2xl flex-shrink-0">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    
                </div>
            </div>

            <nav id="bar_menu" class="space-y-1">
                <a href="{{url_for('admin.dashboard')}}" 
                    class="flex items-center gap-3 px-4 py-3 rounded-xl transition duration-200
                        {% if request.endpoint == 'admin.dashboard' %}
                            bg-slate-900 shadow-lg text-white
                        {% else %}
                            hover:bg-slate-800 group text-slate-400
                        {% endif %}">

                    <svg class="w-5 h-5 {% if request.endpoint == 'admin.dashboard' %} text-yellow-500 {% else %} group-hover:text-white {% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"></path>
                    </svg>
                    <span class="{% if request.endpoint == 'admin.dashboard' %} font-semibold text-yellow-500 {% else %} font-medium group-hover:text-white {% endif %}">
                        Dashboard
                    </span>
                </a>

                <a href="{{url_for('admin.add_student')}}" 
                    class="flex items-center gap-3 px-4 py-3 rounded-xl transition duration-200
                    {% if request.endpoint == 'admin.add_student' %}
                        bg-slate-900 shadow-lg text-white
                    {% else %}
                        hover:bg-slate-800 group text-slate-400
                    {% endif %}">
                    <svg class="w-5 h-5 
                    {% if request.endpoint == 'admin.add_student' %}
                        text-yellow-500
                    {% else %}
                        group-hover:text-white 
                    {% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                    <span class="
                    {% if request.endpoint == 'admin.add_student' %}
                        font-semibold text-yellow-500
                    {% else %}
                    font-medium group-hover:text-white
                    {% endif %}">Thêm sinh viên</span>
                </a>
                
                <a href="{{url_for('admin.export_page')}}" 
                class="flex items-center gap-3 px-4 py-3 rounded-xl transition duration-200
                {% if request.endpoint == 'admin.export_page' %}
                    bg-slate-900 shadow-lg text-white
                {% else %}
                    hover:bg-slate-800 group text-slate-400
                {% endif %}">
                    <svg class="w-5 h-5 
                    {% if request.endpoint == 'admin.export_page' %}
                        text-yellow-500
                    {% else %}
                        group-hover:text-white
                    {% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span class="
                    {% if request.endpoint == 'admin.export_page' %}
                        font-semibold text-yellow-500
                    {% else %}
                        font-medium group-hover:text-white
                    {% endif %}">Xuất Excel</span>
                </a>

            </nav>
        </div>
        <a href="{{url_for('admin.logout')}}" id="bar_logout" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-900/30 text-rose-400 transition duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span class="font-medium">Đăng xuất</span>
        </a>
    </div>

    <div class="flex-1 flex flex-col overflow-hidden">

        <main class="flex-1 overflow-y-auto">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <div id="globalLoader" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[9999] hidden flex-col items-center justify-center transition-all duration-300">
        <i class="fa-solid fa-spinner fa-spin text-emerald-500 text-6xl mb-6 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]"></i>
        <h3 id="loaderText" class="text-2xl font-bold text-white tracking-wider drop-shadow-md">Đang xử lý...</h3>
        <p class="text-emerald-200/60 text-sm mt-3 animate-pulse">Vui lòng không đóng trình duyệt</p>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        const sidebarText = document.getElementById('sidebarText');
        const bar_menu = document.getElementById('bar_menu');
        const bar_logout = document.getElementById('bar_logout');

        toggleBtn.addEventListener('click', ()=>{
            sidebar.classList.toggle('w-64');
            sidebar.classList.toggle('w-20');

            sidebarText.classList.toggle('hidden');
            bar_menu.classList.toggle('hidden');
            bar_logout.classList.toggle('hidden');
        });

        function updateCurrentDate() {
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const now = new Date();
            const dayName = days[now.getDay()];
            const d = String(now.getDate()).padStart(2, '0'); 
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear(); // Lấy năm
            
            // Ghép chuỗi lại và nhét vào HTML
            document.getElementById("currentDate").textContent = `${dayName}, ${d}/${m}/${y}`;
        }
        updateCurrentDate();
    </script>
    <script src="{{ url_for('static', filename='js/loader.js') }}"></script>
</body>
</html>
