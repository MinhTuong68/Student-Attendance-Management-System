<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng nhập Quản trị</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <style>
            body { font-family: 'Inter', sans-serif; }
        </style>
    </head>
    <body class="bg-slate-50 h-screen flex items-center justify-center">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-8 m-4">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-slate-900 text-yellow-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-5 shadow-lg">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Trang quản trị</h2>
                <p class="text-sm text-slate-500 mt-1.5">Hệ thống điểm danh sinh viên</p>
            </div>

            {% with messages = get_flashed_messages(category_filter=['error']) %}
                {% if messages %}
                <div class="mb-5 p-3.5 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl text-sm flex items-center gap-2.5 animate-pulse">
                    <i class="fas fa-circle-exclamation text-base"></i>
                    <span class="font-medium">{{ messages[0] }}</span>
                </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Tên đăng nhập</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-user text-slate-400 text-sm"></i>
                        </div>
                        <input type="text" name="username" required placeholder="Nhập tài khoản..."
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-slate-800 focus:border-slate-800 outline-none text-slate-700 transition-all bg-slate-50 focus:bg-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Mật khẩu</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-400 text-sm"></i>
                        </div>
                        <input type="password" name="password" required placeholder="Nhập mật khẩu..."
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-slate-800 focus:border-slate-800 outline-none text-slate-700 transition-all bg-slate-50 focus:bg-white">
                    </div>
                </div>
                <button type="submit"
                    class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mt-4">
                    <span>Đăng nhập hệ thống</span>
                    <i class="fas fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>
    </body>
</html>
